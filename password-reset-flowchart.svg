<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740" viewBox="0 0 1200 1740" role="img" aria-labelledby="title description">
  <title id="title">Password reset flowchart</title>
  <desc id="description">Flowchart showing email validation, account lookup, SMTP delivery of a verification code, and password reset verification.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #526176; }
      .label { font-size: 18px; font-weight: 600; }
      .small { font-size: 15px; fill: #526176; }
      .edge-label { font-size: 15px; font-weight: 700; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .process { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .decision { fill: #fffbeb; stroke: #f59e0b; stroke-width: 2; }
      .start { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .success { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .failure { fill: #fff1f2; stroke: #f43f5e; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="1740" fill="#f8fafc"/>
  <text class="title" x="600" y="58" text-anchor="middle">Password Reset Flow</text>
  <text class="subtitle" x="600" y="88" text-anchor="middle">Request a verification code, verify it, then update the password</text>

  <!-- Request and account lookup -->
  <rect class="start" x="430" y="120" width="340" height="64" rx="32"/>
  <text class="label" x="600" y="159" text-anchor="middle">User requests password reset</text>

  <rect class="process" x="430" y="225" width="340" height="68" rx="12"/>
  <text class="label" x="600" y="254" text-anchor="middle">Validate email address</text>
  <text class="small" x="600" y="277" text-anchor="middle">POST request-password-reset</text>

  <polygon class="decision" points="600,330 735,390 600,450 465,390"/>
  <text class="label" x="600" y="385" text-anchor="middle">Email valid?</text>

  <rect class="failure" x="60" y="358" width="285" height="64" rx="12"/>
  <text class="label" x="202" y="397" text-anchor="middle">Return validation error</text>

  <rect class="process" x="430" y="490" width="340" height="68" rx="12"/>
  <text class="label" x="600" y="519" text-anchor="middle">Look up account by email</text>
  <text class="small" x="600" y="542" text-anchor="middle">Use normalized email address</text>

  <polygon class="decision" points="600,590 735,650 600,710 465,650"/>
  <text class="label" x="600" y="645" text-anchor="middle">Account exists?</text>

  <rect class="success" x="855" y="618" width="285" height="68" rx="12"/>
  <text class="label" x="997" y="647" text-anchor="middle">Return generic response</text>
  <text class="small" x="997" y="670" text-anchor="middle">Do not reveal account existence</text>

  <!-- Create and send code -->
  <rect class="process" x="430" y="750" width="340" height="76" rx="12"/>
  <text class="label" x="600" y="781" text-anchor="middle">Generate 6-digit code</text>
  <text class="small" x="600" y="806" text-anchor="middle">Hash it and save with 15-minute expiry</text>

  <rect class="process" x="430" y="866" width="340" height="76" rx="12"/>
  <text class="label" x="600" y="897" text-anchor="middle">Load SMTP configuration</text>
  <text class="small" x="600" y="922" text-anchor="middle">Host, port, TLS, and credentials</text>

  <polygon class="decision" points="600,970 735,1030 600,1090 465,1030"/>
  <text class="label" x="600" y="1025" text-anchor="middle">Config and SMTP</text>
  <text class="label" x="600" y="1048" text-anchor="middle">connection ready?</text>

  <rect class="failure" x="855" y="998" width="285" height="68" rx="12"/>
  <text class="label" x="997" y="1027" text-anchor="middle">Log failure and return error</text>
  <text class="small" x="997" y="1050" text-anchor="middle">Configuration or delivery issue</text>

  <rect class="process" x="430" y="1130" width="340" height="76" rx="12"/>
  <text class="label" x="600" y="1161" text-anchor="middle">Send code by email</text>
  <text class="small" x="600" y="1186" text-anchor="middle">Start TLS, authenticate, send message</text>

  <polygon class="decision" points="600,1230 735,1290 600,1350 465,1290"/>
  <text class="label" x="600" y="1296" text-anchor="middle">Email sent?</text>

  <rect class="failure" x="855" y="1258" width="285" height="68" rx="12"/>
  <text class="label" x="997" y="1287" text-anchor="middle">Log failure and return error</text>
  <text class="small" x="997" y="1310" text-anchor="middle">Ask user to try again later</text>

  <rect class="success" x="430" y="1390" width="340" height="68" rx="12"/>
  <text class="label" x="600" y="1419" text-anchor="middle">Tell user to check their email</text>
  <text class="small" x="600" y="1442" text-anchor="middle">Generic response for all valid requests</text>

  <!-- Verify code and update password -->
  <rect class="process" x="430" y="1490" width="340" height="76" rx="12"/>
  <text class="label" x="600" y="1521" text-anchor="middle">User submits code and new password</text>
  <text class="small" x="600" y="1546" text-anchor="middle">Validate email, 6-digit code, password length</text>

  <polygon class="decision" points="600,1590 735,1650 600,1710 465,1650"/>
  <text class="label" x="600" y="1645" text-anchor="middle">Code matches and</text>
  <text class="label" x="600" y="1668" text-anchor="middle">is not expired?</text>

  <rect class="failure" x="60" y="1618" width="285" height="68" rx="12"/>
  <text class="label" x="202" y="1647" text-anchor="middle">Reject code</text>
  <text class="small" x="202" y="1670" text-anchor="middle">Ask user to request a new one</text>

  <!-- Final outcome is placed at the bottom-right, with a connector from valid code. -->
  <rect class="success" x="855" y="1618" width="285" height="68" rx="12"/>
  <text class="label" x="997" y="1647" text-anchor="middle">Update password</text>
  <text class="small" x="997" y="1670" text-anchor="middle">Delete token and return success</text>

  <!-- Connectors -->
  <path class="edge" d="M600 184 V225"/>
  <path class="edge" d="M600 293 V330"/>
  <path class="edge" d="M465 390 H345"/>
  <text class="edge-label" x="398" y="378" text-anchor="middle">No</text>
  <path class="edge" d="M600 450 V490"/>
  <text class="edge-label" x="619" y="475">Yes</text>
  <path class="edge" d="M600 558 V590"/>
  <path class="edge" d="M735 650 H855"/>
  <text class="edge-label" x="795" y="638" text-anchor="middle">No</text>
  <path class="edge" d="M600 710 V750"/>
  <text class="edge-label" x="619" y="735">Yes</text>
  <path class="edge" d="M600 826 V866"/>
  <path class="edge" d="M600 942 V970"/>
  <path class="edge" d="M735 1030 H855"/>
  <text class="edge-label" x="795" y="1018" text-anchor="middle">No</text>
  <path class="edge" d="M600 1090 V1130"/>
  <text class="edge-label" x="619" y="1115">Yes</text>
  <path class="edge" d="M600 1206 V1230"/>
  <path class="edge" d="M735 1290 H855"/>
  <text class="edge-label" x="795" y="1278" text-anchor="middle">No</text>
  <path class="edge" d="M600 1350 V1390"/>
  <text class="edge-label" x="619" y="1375">Yes</text>
  <path class="edge" d="M600 1458 V1490"/>
  <path class="edge" d="M600 1566 V1590"/>
  <path class="edge" d="M465 1650 H345"/>
  <text class="edge-label" x="398" y="1638" text-anchor="middle">No</text>
  <path class="edge" d="M735 1650 H855"/>
  <text class="edge-label" x="795" y="1638" text-anchor="middle">Yes</text>
</svg>
